name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # Monday 4:23 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: go

      - uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

      # Skip SARIF upload — requires GitHub Advanced Security (paid for private repos).
      # The analysis still runs and logs findings in the workflow output.
      # To enable the Security tab, either make the repo public or enable GHAS,
      # then replace this step with: github/codeql-action/analyze@...
      - name: Export SARIF
        run: |
          echo "CodeQL analysis complete. SARIF upload skipped (private repo)."
          echo "To review results, check the 'Autobuild' step logs above."
